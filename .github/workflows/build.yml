name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame pyinstaller

      - name: Build EXE
        shell: cmd
        run: pyinstaller --noconfirm --windowed --onefile --add-data "assets;assets" --name VS_RED main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: VS_RED_Windows
          path: dist/VS_RED.exe
